<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9; --ink:#262626; --name:#a3a3a1; --nav:#8c8c8a; --soft:#666664; --nav-on:#262626;
  --link:#262626; --wash:rgba(250,250,249,.72); --ph:#eeeeec; --line:#e4e4e2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{padding:0 clamp(20px,4vw,74px) 80px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  gap:12px 28px;padding:34px 0 38px}
.name{font-size:clamp(26px,2.4vw,34px);font-weight:700;letter-spacing:-.035em;color:var(--name)}
nav{display:flex;gap:26px;font-size:17px;letter-spacing:-.01em}
nav a{color:var(--nav);transition:color .2s}
nav a:hover,nav a.on{color:var(--nav-on)}
a:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.card{position:relative;display:block;aspect-ratio:1.63;overflow:hidden;background:var(--ph)}
.card img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.card::after{content:"";position:absolute;inset:0;background:var(--wash);opacity:0;transition:opacity .35s}
.card .t{position:absolute;z-index:1;left:9%;top:50%;transform:translateY(-50%);
  font-size:clamp(28px,3.1vw,50px);letter-spacing:-.03em;opacity:0;transition:opacity .35s}
.card:hover::after,.card:focus-visible::after{opacity:1}
.card:hover .t,.card:focus-visible .t{opacity:1}
@media (hover:none){.card::after{opacity:.55}.card .t{opacity:1}}
.ph{display:flex;align-items:center;justify-content:center;color:#00000040;font-size:14px}
.case{max-width:880px;margin:0 auto}
.case .hero{aspect-ratio:1.5;margin-bottom:56px}
.case h2{font-size:clamp(30px,3.4vw,42px);font-weight:700;letter-spacing:-.04em;margin:64px 0 22px}
.case p{font-size:18px;line-height:1.6;letter-spacing:-.01em;margin:0 0 40px;max-width:780px}
.row{display:grid;gap:clamp(14px,3vw,48px);margin-bottom:48px}
.row.c3{grid-template-columns:repeat(3,1fr)}
.row.c4{grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,28px)}
.row .ph{aspect-ratio:.8}
.row.c4 .ph{aspect-ratio:1}
.back{display:inline-block;margin:0 0 28px;color:var(--nav);font-size:15px}
.back:hover{color:var(--nav-on)}
.jobs{border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:24px;padding:44px 0 52px;border-bottom:1px solid var(--line)}
.jdate{color:var(--nav);font-size:17px;letter-spacing:-.01em;padding-top:.7em}
.jtitle{margin:0;font-size:clamp(24px,2.8vw,40px);font-weight:400;letter-spacing:-.035em;line-height:1.1}
.jorg{margin:10px 0 28px;font-size:17px;letter-spacing:-.01em;color:var(--nav)}
.jc2 p{font-size:18px;line-height:1.6;letter-spacing:-.01em;margin:0 0 22px;max-width:720px}
.jc2 ul{list-style:none;margin:0 0 36px;padding:0;max-width:720px}
.jc2 li{position:relative;padding:7px 0 7px 22px;font-size:16px;line-height:1.55;color:var(--soft)}
.jc2 li::before{content:"–";position:absolute;left:0;color:var(--nav)}
.jshots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.jshots .ph{height:auto;aspect-ratio:1.4}
.jshots img{width:100%;aspect-ratio:1.4;object-fit:cover;display:block}
@media (max-width:760px){.job{grid-template-columns:1fr;gap:10px;padding:32px 0 40px}.jdate{padding-top:0}.jshots{gap:8px}}
.gallery{max-width:1000px;margin:64px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.gallery .ph,.gallery img{width:100%;height:auto;aspect-ratio:1.25;object-fit:cover;display:block}
@media (max-width:760px){.gallery{grid-template-columns:1fr 1fr;gap:14px;margin-top:48px}}
.about{display:flex;gap:42px;max-width:1000px;margin:12px auto 0;align-items:flex-start}
.about .photo{flex:0 0 295px;aspect-ratio:1}
.about h1{font-size:40px;font-weight:700;letter-spacing:-.04em;margin:0 0 34px}
.about p{font-size:20px;line-height:1.5;letter-spacing:-.01em;margin:0 0 28px;max-width:640px}
.about a{color:var(--link);text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){
  .grid{grid-template-columns:1fr;gap:20px}
  .row.c3{grid-template-columns:1fr 1fr}
  .row.c4{grid-template-columns:1fr 1fr}
  .about{flex-direction:column;gap:24px}
  .about .photo{flex-basis:auto;width:100%;max-width:295px}
  nav{gap:18px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="name" id="name" href="#project"></a>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</div>
<script>
/* ---------- Edit this block ---------- */
const SITE = {
  name: "Brian",
  email: "you@example.com",
  bio: "Describe what you do and where you study or work. Always working on a project!",
  photo: "", // portrait next to the bio (image path)
  resume: "resume.pdf", // resume file, placed next to this HTML (set "" to hide the link)
  photos: ["","","","","",""] // photo slots below the bio; add paths, or add/remove entries
};
// img: cover image path (leave "" for a placeholder). color: placeholder tint.
const PROJECTS = [
  {id:"1", title:"Project One",   color:"#e6e6e4", img:""},
  {id:"2", title:"Project Two",   color:"#f1f1ef", img:""},
  {id:"3", title:"Project Three", color:"#ececea", img:""},
  {id:"4", title:"Project Four",  color:"#e6e6e4", img:""}
];
// imgs: up to 3 photo paths per role.
const EXPERIENCE = [
  {role:"HVAC Engineering Intern", org:"Jaros Baum & Bolles", date:"Summer 2025", color:"#f1f1ef", imgs:[],
   intro:"Supported team of HVAC Engineers outfitting new and renovated buildings with to-code HVAC equipment. Worked on high-profile projects including Northeast corridor such as offices, data centers, and laboratories.",
   bullets:["Performed heating and cooling load calculations using Trane TRACE software and sized HVAC equipment accordingly",
     "Reviewed equipment submittals and checked code requirements (ASHRAE, SMACNA) to accept/deny contractor proposals",
     "Drafted and revised HVAC systems in Revit, maintaining company and industry standards",
     "Completed thermal comfort study for Bain Capital’s John Hancock Tower (200 Clarendon St) renovation in Boston",
     "Designed HVAC systems for CV Properties 200 Dyer Street Apartment building in Providence, RI"]},
  {role:"Machine Shop Student Advisor", org:"Boston University Engineering Product Innovation Center", date:"Fall 2024 – Present", now:true, color:"#ececea", imgs:[],
   intro:"Oversee BU’s Machine Shop floor and product design center, supervising students and maintaining advanced manufacturing equipment. BU SciShield Lab Safety certified.",
   bullets:["Supervise machine shop operations and teach students proper use of Haas CNC Mills, Proto-Trak CNC Lathes, and Bridgeport Manual Mills",
     "Optimize engineering project designs with machining-conscious and efficiency-driven decisions",
     "Enforce strict safety protocols and perform routine maintenance on manufacturing equipment",
     "Manage advanced equipment including Bambu 3D printers, FormLabs resin printers, ProtoMAX Waterjet, and Epilog Laser Cutter",
     "Personally responsible for upkeep of adopted horizontal bandsaw through Adopt-A-Tool program"]},
  {role:"Research and Design Mechanical Engineering Intern", org:"Rypos Inc.", date:"Summer 2021", color:"#e6e6e4", imgs:[],
   intro:"Optimized Rypos’ Diesel Automotive Particulate filter design through materials research and testing. Developed lab safety protocols and presented findings to engineering team.",
   bullets:["Tested and selected new concrete-based alternatives for filter adhesive materials",
     "Conducted analysis and strength testing of filter components",
     "Developed lab safety, precision, and data accumulation skills in industrial research environment",
     "Presented weekly progress updates to Rypos’ team of engineers"]}
];
// Extra: same format as PROJECTS. Each tile opens its own page.
const EXTRA = [
  {id:"x1", title:"Extra One",   color:"#ececea", img:""},
  {id:"x2", title:"Extra Two",   color:"#e6e6e4", img:""},
  {id:"x3", title:"Extra Three", color:"#f1f1ef", img:""},
  {id:"x4", title:"Extra Four",  color:"#ececea", img:""}
];
const LABELS = {project:"Projects", experience:"Experience", about:"About", extra:"Extra"};
/* ------------------------------------- */

const $ = s => document.querySelector(s);
const ph = c => `<div class="ph" style="background:${c}"></div>`;
function media(p, cls = "") {
  return p.img ? `<img class="${cls}" src="${p.img}" alt="${p.title}">`
    : `<div class="ph ${cls}" style="background:${p.color}">Add image</div>`;
}
const gridView = list => `<section class="grid">${list.map(p =>
  `<a class="card" href="#case-${p.id}">${media(p)}<span class="t">${p.title}</span></a>`).join("")}</section>`;
const projectView = () => gridView(PROJECTS);
const extraView = () => gridView(EXTRA);
const caseView = (p, sec) => `<article class="case">
  <a class="back" href="#${sec}">Back to ${LABELS[sec]}</a>
  ${media(p, "hero")}
  <h2>${p.title}</h2>
  <p>One or two sentences on the problem, your role, and the result.</p>
  <div class="row c3">${[1,2,3].map(() => ph(p.color)).join("")}</div>
  <h2>Process</h2>
  <p>Explain how you got there: sketches, prototypes, tests, and what changed along the way.</p>
  <div class="row c4">${Array.from({length:8}, () => ph(p.color)).join("")}</div>
</article>`;
const expView = () => `<section class="jobs">${EXPERIENCE.map(e => `
  <article class="job">
    <div class="jdate">${e.date}</div>
    <div class="jc2">
      <h3 class="jtitle">${e.role}</h3><div class="jorg">${e.org}</div>
      <p>${e.intro}</p>
      <ul>${e.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
      <div class="jshots">${[0,1,2].map(k => e.imgs[k] ? `<img src="${e.imgs[k]}" alt="">` : ph(e.color)).join("")}</div>
    </div>
  </article>`).join("")}</section>`;
const aboutView = () => `<section class="about">
  <div class="photo">${SITE.photo ? `<img src="${SITE.photo}" alt="${SITE.name}" style="width:100%;height:100%;object-fit:cover">` : `<div class="ph" style="height:100%;background:var(--ph)">Add photo</div>`}</div>
  <div><h1>About</h1><p>${SITE.bio}</p><p>If you’d like to get in touch: <a href="mailto:${SITE.email}">${SITE.email}</a></p>
  ${SITE.resume ? `<p><a href="${SITE.resume}" download>Download resume ↓</a></p>` : ""}</div>
</section>
<section class="gallery">${SITE.photos.map(src => src ? `<img src="${src}" alt="">` : `<div class="ph" style="background:var(--ph)">Add photo</div>`).join("")}</section>`;

function render() {
  const hash = location.hash.slice(1) || "project";
  const proj = [...PROJECTS, ...EXTRA].find(p => "case-" + p.id === hash);
  const active = proj ? (EXTRA.includes(proj) ? "extra" : "project") : (LABELS[hash] ? hash : "project");
  $("#name").textContent = SITE.name;
  $("#nav").innerHTML = Object.keys(LABELS).map(k =>
    `<a href="#${k}" class="${k === active ? "on" : ""}">${LABELS[k]}</a>`).join("");
  $("#main").innerHTML = proj ? caseView(proj, active) : active === "experience" ? expView() : active === "extra" ? extraView() : active === "about" ? aboutView() : projectView();
  document.title = SITE.name;
  scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
